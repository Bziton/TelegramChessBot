<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Telegram Chess Casino</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #090909;
      --panel: #151515;
      --panel-2: #21170f;
      --line: #3a281b;
      --text: #fff8ef;
      --muted: #b8a99b;
      --gold: #ff8a24;
      --orange-light: #ffc15a;
      --orange-dark: #c84c10;
      --green: #63d69a;
      --danger: #f17b87;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 90% -5%, rgba(255, 116, 22, .2), transparent 32%),
        radial-gradient(circle at 0% 55%, rgba(177, 54, 8, .12), transparent 30%),
        linear-gradient(145deg, #080808 0%, #12100e 55%, #090909 100%);
      font: 15px/1.45 Georgia, "Times New Roman", serif;
    }
    button { font: inherit; color: inherit; border: 0; cursor: pointer; }
    .app { max-width: 620px; margin: 0 auto; padding: 22px 16px 34px; animation: page-in .65s ease both; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; animation: slide-down .55s ease both; }
    .brand { display: flex; gap: 11px; align-items: center; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--gold); background: linear-gradient(145deg, #3a1b0b, #17100b); color: var(--orange-light); font-size: 23px; box-shadow: 0 0 22px rgba(255, 111, 18, .2); }
    .eyebrow { margin: 0; color: var(--gold); font: 11px/1.2 Arial, sans-serif; letter-spacing: 1.7px; text-transform: uppercase; }
    h1, h2, p { margin: 0; }
    h1 { margin-top: 3px; font-size: 25px; font-weight: 700; }
    .balance { padding: 9px 12px; border: 1px solid #6f3a1b; background: linear-gradient(145deg, rgba(49, 27, 14, .9), rgba(20, 17, 15, .9)); text-align: right; box-shadow: 0 0 20px rgba(255, 111, 18, .08); }
    .balance small { display: block; color: var(--muted); font: 10px Arial, sans-serif; text-transform: uppercase; }
    .balance strong { color: var(--orange-light); font-size: 19px; }
    .hero { position: relative; overflow: hidden; padding: 24px; border: 1px solid #74401f; background: linear-gradient(135deg, rgba(55, 28, 13, .96), rgba(19, 18, 17, .98) 62%); box-shadow: inset 0 1px rgba(255, 176, 75, .1), 0 16px 35px rgba(0,0,0,.25); animation: rise-in .65s .1s ease both; }
    .hero::after { content: ""; position: absolute; width: 180px; height: 180px; right: -65px; top: -75px; border: 1px solid rgba(255, 138, 36, .22); transform: rotate(35deg); box-shadow: 0 0 35px rgba(255, 111, 18, .14); }
    .hero h2 { max-width: 350px; font-size: 27px; line-height: 1.1; }
    .hero p { max-width: 440px; margin-top: 10px; color: var(--muted); }
    .hero button { position: relative; z-index: 1; margin-top: 20px; padding: 12px 17px; background: linear-gradient(110deg, var(--orange-light), var(--gold) 45%, var(--orange-dark)); color: #211108; font-weight: 700; box-shadow: 0 8px 22px rgba(255, 104, 15, .2); transition: transform .2s ease, box-shadow .2s ease; }
    .hero button:hover { transform: translateY(-2px); box-shadow: 0 11px 28px rgba(255, 104, 15, .34); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; }
    .section-head h2 { font-size: 20px; }
    .section-head span { color: var(--muted); font: 11px Arial, sans-serif; text-transform: uppercase; }
    .games { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .game { min-height: 126px; padding: 17px; border: 1px solid var(--line); background: linear-gradient(145deg, #191919, #111111); text-align: left; transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; animation: rise-in .55s ease both; }
    .game:nth-child(1) { animation-delay: .18s; }
    .game:nth-child(2) { animation-delay: .25s; }
    .game:nth-child(3) { animation-delay: .32s; }
    .game:nth-child(4) { animation-delay: .39s; }
    .game:active { transform: translateY(2px); }
    .game:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 12px 28px rgba(255, 102, 12, .15); }
    .game .icon { display: block; margin-bottom: 16px; font-size: 27px; }
    .game b { display: block; font-size: 17px; }
    .game small { display: block; margin-top: 3px; color: var(--muted); }
    .game.cases { background: linear-gradient(145deg, #3a210e, #171311); }
    .game.duel { background: linear-gradient(145deg, #2b1a12, #151515); }
    .status { display: none; margin-top: 12px; padding: 11px 13px; border-left: 3px solid var(--green); background: #10251f; color: #bcebd1; }
    .status.show { display: block; }
    .game-panel { display: none; margin-top: 18px; padding: 18px; border: 1px solid #72591f; background: #211d13; }
    .game-panel.show { display: block; }
    .game-panel h2 { margin-bottom: 12px; font-size: 21px; }
    .cards { display: flex; gap: 8px; margin: 10px 0; }
    .card { display: grid; place-items: center; width: 44px; height: 58px; border: 1px solid #d5ae4a; background: #f8f2df; color: #16130d; font: 25px Georgia, serif; }
    .game-actions { display: flex; gap: 8px; margin-top: 15px; }
    .game-actions button, .bet-row button { padding: 11px 15px; background: var(--gold); color: #211b0d; font-weight: 700; }
    .bet-row { display: flex; gap: 8px; margin-top: 12px; }
    .bet-row input { width: 110px; padding: 10px; border: 1px solid #72591f; background: #0d1119; color: white; font: inherit; }
    .bottom { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 25px; }
    .bottom button { padding: 12px 8px; border: 1px solid var(--line); background: #141414; color: var(--muted); font-size: 12px; transition: color .2s ease, border-color .2s ease; }
    .bottom button:hover { color: var(--orange-light); border-color: #78401e; }
    @keyframes page-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slide-down { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rise-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 390px) { .app { padding-inline: 12px; } .hero { padding: 19px; } .hero h2 { font-size: 23px; } .balance { padding: 7px 9px; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">♞</div><div><p class="eyebrow">Telegram Chess</p><h1>Casino room</h1></div></div>
      <div class="balance"><small>Баланс</small><strong id="balance">0 оч.</strong></div>
    </header>

    <section class="hero">
      <p class="eyebrow">Грай розумно</p>
      <h2>Твій стіл уже відкритий.</h2>
      <p>Blackjack, кейси й дуелі зібрані в одному швидкому просторі.</p>
      <button id="bonus">🎁 Забрати щоденний бонус</button>
      <div class="status" id="status"></div>
    </section>

    <div class="section-head"><h2>Ігри</h2><span>проти бота</span></div>
    <section class="games">
      <button class="game" data-game="blackjack"><span class="icon">🃏</span><b>Blackjack</b><small>Hit, Stay, 21</small></button>
      <button class="game" data-game="dice"><span class="icon">🎲</span><b>Кості</b><small>Вища сума забирає банк</small></button>
      <button class="game cases" data-game="cases"><span class="icon">📦</span><b>Кейси</b><small>Відкрий свій дроп</small></button>
      <button class="game duel" data-game="duel"><span class="icon">👥</span><b>Дуель</b><small>Грай з другом</small></button>
    </section>
    <section class="game-panel" id="game-panel"></section>

    <nav class="bottom">
      <button data-page="profile">👤 Профіль</button>
      <button data-page="leaderboard">🏆 Лідерборд</button>
      <button data-page="history">📜 Історія</button>
    </nav>
  </main>
  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();
    const status = document.getElementById('status');
    const balance = document.getElementById('balance');
    const panel = document.getElementById('game-panel');
    const initData = tg?.initData || '';
    let lastBet = 0;
    const showStatus = (text) => { status.textContent = text; status.classList.add('show'); };
    const api = async (path, options = {}) => {
      const response = await fetch(path, { ...options, headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData, ...(options.headers || {}) } });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Помилка сервера');
      return data;
    };
    const card = (value) => `<span class="card">${value === 11 ? 'A' : value}</span>`;
    const drawCards = (values) => values.map(card).join('');
    const refreshProfile = async () => {
      try {
        const profile = await api('/api/profile');
        balance.textContent = `${profile.casino_balance} оч.`;
      } catch (error) {
        showStatus('Відкрий Mini App саме з Telegram, щоб завантажити профіль.');
      }
    };
    const showBlackjack = (presetBet = '') => {
      panel.classList.add('show');
      panel.innerHTML = `<h2>🃏 Blackjack</h2><p>Введи ставку і зіграй проти дилера.</p><div class="bet-row"><input id="bet" type="number" min="1" value="${presetBet}" placeholder="Ставка"><button id="start">Почати</button></div>`;
      document.getElementById('start').onclick = async () => {
        const bet = Number(document.getElementById('bet').value);
        try { lastBet = bet; renderBlackjack(await api('/api/blackjack/start', { method: 'POST', body: JSON.stringify({ bet }) })); } catch (error) { showStatus(`❌ ${error.message}`); }
      };
    };
    const renderBlackjack = (game) => {
      panel.classList.add('show');
      const finished = game.status === 'finished';
      panel.innerHTML = `<h2>🃏 Blackjack</h2><p>Дилер</p><div class="cards">${drawCards(game.dealer)}</div><p>Ти · ${game.total}</p><div class="cards">${drawCards(game.player)}</div>${finished ? `<p><b>${game.result}</b> · ${game.change > 0 ? '+' : ''}${game.change} оч.</p><p>Баланс: <b>${game.balance}</b></p><div class="game-actions"><button id="again">🔁 Повторити ставку ${lastBet}</button><button id="different">✏️ Інша ставка</button></div>` : `<div class="game-actions"><button id="hit">➕ Hit</button><button id="stay">✋ Stay</button></div>`}`;
      if (finished) {
        document.getElementById('again').onclick = async () => { try { renderBlackjack(await api('/api/blackjack/start', { method: 'POST', body: JSON.stringify({ bet: lastBet }) })); } catch (error) { showStatus(`❌ ${error.message}`); } };
        document.getElementById('different').onclick = () => showBlackjack();
      }
      else ['hit', 'stay'].forEach((action) => { document.getElementById(action).onclick = async () => { try { renderBlackjack(await api('/api/blackjack/action', { method: 'POST', body: JSON.stringify({ action }) })); await refreshProfile(); } catch (error) { showStatus(`❌ ${error.message}`); } }; });
    };
    document.querySelectorAll('[data-game]').forEach((button) => button.addEventListener('click', () => {
      if (button.dataset.game === 'blackjack') return showBlackjack();
      const labels = { dice: '🎲 Кості підключимо наступними.', cases: '📦 Кейси підключимо наступними.', duel: '👥 Дуелі підключимо наступними.' };
      showStatus(labels[button.dataset.game]);
    }));
    document.querySelectorAll('[data-page]').forEach((button) => button.addEventListener('click', () => showStatus(`Розділ «${button.textContent.trim()}» готується.`)));
    document.getElementById('bonus').addEventListener('click', () => showStatus('🎁 Щоденний бонус підключимо до Supabase на наступному кроці.'));
    refreshProfile();
  </script>
</body>
</html>
